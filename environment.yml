channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12
  - r-base=4.4
  - pip
  - numpy
  - pandas
  - anndata
  - tqdm
  - scanpy
  - rpy2
  - anndata2ri
  - scipy
  - scikit-image
  - matplotlib
  - r-seurat
  - git
  - r-remotes
  - r-harmony=1.2.0
  - r-seurat-disk
  - r-optparse
  - r-sceasy
  # sceasy reads h5ad through Python's anndata via reticulate; pin it explicitly
  # rather than relying on it arriving as an r-sceasy dependency.
  - r-reticulate
