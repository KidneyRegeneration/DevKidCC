name: Build and Publish Container

on:
  push:
    branches:
      - main
      - containerise
      - containerise-v0.5.1
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main
      - containerise
      - containerise-v0.5.1

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image is ~4 GB compressed and has to be loaded into the local daemon
      # for the smoke test below, on a runner that ships with ~14 GB free.
      # Reclaiming the preinstalled toolchains buys ~20 GB and costs seconds.
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Python wrapper is cloned from a branch inside the Dockerfile, and a
      # branch name in a RUN line is invisible to the layer cache. Resolve it to
      # a SHA here so a wrapper commit actually rebuilds the image -- and so the
      # image records which wrapper it contains.
      - name: Resolve Python wrapper commit
        id: wrapper
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/commits/$WRAPPER_BRANCH" --jq .sha)
          echo "Wrapper $WRAPPER_BRANCH -> $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRAPPER_BRANCH: python-wrapper-v0.5.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kidneyregeneration/dkcc
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      # Build first without publishing, so the smoke test gates the push. A green
      # build says nothing about whether the image runs: this workflow published
      # five green images in which both the R and the Python entry point failed
      # on any real input.
      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: dkcc:ci
          build-args: |
            WRAPPER_REF=${{ steps.wrapper.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test both entry points
        run: docker run --rm dkcc:ci python /opt/smoke_test.py

      # Cache-hit rebuild of the exact image just tested, this time tagged and
      # pushed. Nothing recompiles; the layers come straight from the run above.
      - name: Push Docker image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WRAPPER_REF=${{ steps.wrapper.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
